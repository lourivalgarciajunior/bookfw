# {{titulo}} — configuracao da obra
# Criado por bookfw em {{data}}. O que esta aqui e invariante: mudar exige DEC.

titulo: {{titulo}}
slug: {{slug}}
autor: {{autor}}
genero: {{genero}}

# Contrato de voz — o validate cobra coerencia contra isto
pessoa_narrativa: primeira
tempo_verbal: passado
publico: adulto

# Metas
palavras_alvo: 60000
palavras_por_capitulo: 2500

# Capa — quanto o veu escurece a arte para o titulo ler (0 a 1)
# 0.42 e calibrado para foto clara; arte escura pede menos
capa_escurecer: 0.42

# Governanca
wip_limit: 1
