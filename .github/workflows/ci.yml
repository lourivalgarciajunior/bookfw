name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # O bookfw escreve arquivo de livro no disco do autor, e o autor esta no
    # Windows. Bug de CRLF e de nome de arquivo so aparece la — mas o Linux
    # pega o caso inverso, entao os dois rodam.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sem dependencia de runtime; a unica opcional e a do `bookfw docx`.
      - run: npm install --no-audit --no-fund

      - run: npm run lint
      - run: npm test
